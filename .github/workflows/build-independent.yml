# SPDX-FileCopyrightText: 2024 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: Build App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      
      - name: Install Node.js dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci
      
      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist
      
      - name: Build frontend assets
        run: npm run build
      
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain js/)" ]; then
            echo "::error::Built JavaScript files are not up to date"
            echo "Please run 'npm ci && npm run build' and commit the changes"
            git status
            git diff js/
            exit 1
          fi
      
      - name: Lint JavaScript
        run: npm run lint
        continue-on-error: true
      
      - name: Lint PHP syntax
        run: |
          find lib -name "*.php" -print0 | xargs -0 -n1 php -l
      
      - name: Check PHP code style (if available)
        run: |
          if [ -f vendor/bin/php-cs-fixer ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff
          fi
        continue-on-error: true
      
      - name: Create build artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build
          rsync -av --exclude='.git*' --exclude='node_modules' --exclude='tests' \
                    --exclude='src' --exclude='.github' --exclude='build' \
                    ./ build/social/
      
      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: social-app-${{ github.sha }}
          path: build/social/
          retention-days: 7
